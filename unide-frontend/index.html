<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HIPERA — Tu mercado de confianza en Meco</title>
    <meta name="description" content="HIPERA es un supermercado familiar en Meco (Madrid) con productos frescos diarios, ofertas semanales y servicio de reparación de móviles. Recogida en tienda gratuita y envío a domicilio en la zona local." />

    <!-- Open Graph / Facebook / WhatsApp preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HIPERA — Tu mercado de confianza en Meco" />
    <meta property="og:description" content="Supermercado familiar en Meco (Madrid) con productos frescos, ofertas semanales y reparación de móviles." />
    <meta property="og:url" content="https://hipera.es" />
    <!-- TODO: replace with HIPERA branded image once store photos available
         (1200x630 with logo, store name, address) -->
    <meta property="og:image" content="https://hipera.es/banners/banner-1.jpg" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="HIPERA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HIPERA — Tu mercado de confianza en Meco" />
    <meta name="twitter:description" content="Supermercado familiar en Meco (Madrid) con productos frescos, ofertas semanales y reparación de móviles." />
    <!-- TODO: replace with HIPERA branded image (see og:image TODO above) -->
    <meta name="twitter:image" content="https://hipera.es/banners/banner-1.jpg" />

    <!-- Robots / SEO técnico -->
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#dc2626" />
    <link rel="canonical" href="https://hipera.es" />

    <!-- ====================================================== -->
    <!-- Schema.org JSON-LD — LocalBusiness / Supermarket        -->
    <!-- Permite que Google muestre rich result (tarjeta lateral -->
    <!-- con dirección, horario y teléfono) al buscar "HIPERA"   -->
    <!-- o "supermercado Meco". Fuente única en index.html para  -->
    <!-- que se entregue en el HTML inicial, no tras hidratación.-->
    <!--                                                          -->
    <!-- ⚠️ Coherencia obligatoria con Política de Envíos §2.2:   -->
    <!-- "areaServed" debe coincidir con la lista de localidades  -->
    <!-- cubiertas en /?legal=envios. Mientras §2.2 esté marcado  -->
    <!-- [PENDIENTE: confirmar con padres], aquí sólo se publica  -->
    <!-- Meco. Cuando se confirme la lista definitiva, actualizar -->
    <!-- AMBOS sitios al mismo tiempo (PoliticaEnvios.jsx §2.2    -->
    <!-- + este bloque) para evitar discrepancias indexadas por   -->
    <!-- Google que pudieran generar reclamaciones de zonas no    -->
    <!-- efectivamente cubiertas.                                 -->
    <!-- ====================================================== -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Supermarket",
      "name": "HIPERA",
      "legalName": "QIANG GUO, S.L.",
      "description": "Supermercado familiar en Meco (Madrid) con productos frescos diarios, ofertas semanales y reparación de móviles. Recogida en tienda gratuita y envío a domicilio en la zona local.",
      "url": "https://hipera.es",
      "image": "https://hipera.es/banners/banner-1.jpg",
      "telephone": "+34918782602",
      "vatID": "B86126638",
      "priceRange": "€",
      "currenciesAccepted": "EUR",
      "paymentAccepted": "Cash, Credit Card, Bizum, Apple Pay, Google Pay",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Paseo del Sol 1",
        "addressLocality": "Meco",
        "postalCode": "28880",
        "addressRegion": "Madrid",
        "addressCountry": "ES"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 40.5499703,
        "longitude": -3.3241069
      },
      "hasMap": "https://www.google.com/maps?q=40.5499703,-3.3241069",
      "makesOffer": [
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Reparación de móviles en Meco",
            "serviceType": "Reparación de teléfonos móviles",
            "areaServed": { "@type": "City", "name": "Meco" },
            "provider": { "@type": "Supermarket", "name": "HIPERA" }
          }
        }
      ],
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday",
            "Sunday"
          ],
          "opens": "09:00",
          "closes": "22:00"
        }
      ],
      "areaServed": [
        { "@type": "City", "name": "Meco" }
      ],
      "knowsAbout": [
        "Productos frescos",
        "Alimentación",
        "Bazar",
        "Reparación de móviles"
      ]
    }
    </script>
    <!-- geo: coordenadas GPS de la entrada de la tienda (Paseo del Sol 1),
         facilitadas por el titular el 2026-06-02. Verificadas sobre el
         edificio real en Google Maps (no el centro del municipio). -->

    <!-- ===============================================================
         Cloudflare Turnstile (anti-bot, anti-abuso del checkout)
         ---------------------------------------------------------------
         Carga diferida con `defer`. La librería sólo se materializa
         cuando el frontend monta el widget (componente
         <TurnstileGate />, ver src/components/TurnstileGate.jsx).
         Si VITE_TURNSTILE_SITE_KEY no está configurado, el componente
         no monta el widget y este script se desperdicia (~30 KB),
         coste asumible para no tener dos versiones del HTML.

         La cabecera Permissions-Policy y CSP no necesitan ajuste:
         Turnstile sólo se comunica con challenges.cloudflare.com
         dentro de un iframe gestionado por el propio script.
         ============================================================ -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
