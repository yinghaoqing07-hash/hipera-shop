# Árbol de funciones del bot para el panel de flujo (/flujo).
# - nodos: cada paso/función con su grupo y, si aplica, los prefijos de
#   etiqueta (match) con los que se registra su ejecución automáticamente.
# - edges: dependencias [prerrequisito, dependiente] — se dibujan como flechas.
# Este archivo se puede editar a mano; si se rompe, el panel de flujo lo avisa
# y se queda vacío (el bot sigue funcionando normal).

nodos:
  # Subpasos REALES de abrir la app (salen de la caja negra del PS:
  # "lanzo:" y la línea RESULT de login). Solo aparecen cuando tocan:
  # si la app ya estaba abierta no hay lanzamiento ni login.
  - id: ug-abrir-lanzar
    nombre: 启动程序
    grupo: 桌面 UnideGes
    desc: 启动 UnideGes 桌面程序（MadisaNet）并等窗口出现；程序已经开着时这步自动跳过。
  - id: ug-abrir-login
    nombre: 自动登录
    grupo: 桌面 UnideGes
    desc: 程序启动后自动填用户名并回车完成登录；之前已登录过则跳过。
  - id: ug-abrir
    nombre: 打开 UnideGes
    grupo: 桌面 UnideGes
    match: ["打开 UnideGes"]
    desc: 打开 UnideGes 主窗口或把它带到前台，是所有桌面操作的总入口（/unideges abrir，或直接说「打开unideges」）。
  - id: ug-inicio
    nombre: 开始营业 (F1)
    grupo: 桌面 UnideGes
    match: ["UnideGes → Inicio de día"]
    desc: 进 Inicio de día 模块做开店初始化，每天开门第一件事，不需要确认。
  - id: ug-articulos
    nombre: 商品 (F3)
    grupo: 桌面 UnideGes
    match: ["UnideGes → Artículos"]
    desc: 进 Artículos（商品）模块；查价、改价、锁定、商品诊断都在它里面操作。
  - id: ug-utilidades
    nombre: 工具 (F6)
    grupo: 桌面 UnideGes
    match: ["UnideGes → Utilidades"]
    desc: 进 Utilidades（工具）模块。
  - id: ug-albaranes
    nombre: 收货单 (F7)
    grupo: 桌面 UnideGes
    match: ["UnideGes → Albaranes"]
    desc: 进 Albaranes（收货单）模块。
  - id: ug-fin
    nombre: 日结 (F12)
    grupo: 桌面 UnideGes
    match: ["UnideGes → Fin de día"]
    desc: 进 Fin de día 做当天日结（关店关账），所以会先问你确认才进。
  - id: ug-albaran-electronico
    nombre: 电子货单
    grupo: 桌面 UnideGes
    match: ["UnideGes → Albarán electrónico"]
    desc: 进 收货单(F7) 再进 Albarán electrónico，那里是「运营信息传递」下载回来的 albaranes，等着处理。第一版只负责开到这儿并截图。
  - id: ug-lmanma
    nombre: LMANMA
    grupo: 桌面 UnideGes
    match: ["UnideGes → LMANMA"]
    desc: 进 工具(F6) 再进 LMANMA，那里处理「运营信息传递」下载回来的 fichero。第一版只负责开到这儿并截图。

  # Cada paso del procesado de albaranes por separado (peticion del dueno,
  # 25/07: "越细越好，这样哪里出错了我可以更容易知道是哪一步"). El PS emite
  # una linea "PASO: <id> ok|fail" por cada uno y el bot los enciende aqui.
  - id: alb-marcar
    nombre: 全选货单
    grupo: 电子货单处理
    desc: 在货单文件列表里点 Marcar todos，把待处理的 .FEL 全勾上。
  - id: alb-procesar
    nombre: 点 Procesar
    grupo: 电子货单处理
    desc: 点 Procesar 开始处理勾选的货单文件。
  - id: alb-desconocidos
    nombre: 未知代码 Aceptar
    grupo: 电子货单处理
    desc: 弹出「Códigos desconocidos」（文件里有不认识的代码）时点 Aceptar，按你定的规矩。没弹就不会亮。
  - id: alb-sustituciones
    nombre: 替代商品 Aceptar
    grupo: 电子货单处理
    desc: 弹出「Artículos albarán distintos a pedidos」（供应商用别的商品替代了你订的）时点 Aceptar。会把货单号报给你，方便事后核对。没弹就不会亮。
  - id: alb-revision
    nombre: 打开复核表
    grupo: 电子货单处理
    desc: 等 Procesar 之后的价格复核表出现（PVP Actual 对 PVP Propuesto 那张）。
  - id: alb-guardar1
    nombre: 保存 (Guardar)
    grupo: 电子货单处理
    desc: 复核表出来后先点一次 Guardar。
  - id: alb-descartar
    nombre: 全部取消变更
    grupo: 电子货单处理
    desc: 点 Descartar todos cambios 把变更全部取消，好逐个看蓝色行。
  - id: alb-azules
    nombre: 找蓝色行
    grupo: 电子货单处理
    desc: 扫描复核表里的蓝色行——蓝色代表这个商品有问题，要先开它看问题再继续。
  - id: alb-azul-diag
    nombre: 诊断问题商品
    grupo: 电子货单处理
    desc: 点蓝色行按 F5 打开商品，用商品诊断那套逻辑判断它有什么问题（只读，不生成 etiqueta——那个已经生成过了）。
  - id: alb-aceptar-todos
    nombre: 接受全部变更
    grupo: 电子货单处理
    desc: 蓝色行都处理完后，点 Aceptar todos cambios 把价格变更全部接受。
  - id: alb-guardar2
    nombre: 再保存
    grupo: 电子货单处理
    desc: 接受变更后再点一次 Guardar。
  - id: alb-confirmar
    nombre: Confirmar
    grupo: 电子货单处理
    desc: 点 Confirmar 提交这张货单。
  - id: alb-si
    nombre: 确认不可逆 (Sí)
    grupo: 电子货单处理
    desc: 回答「确认过程不可逆，继续吗」→ Sí。这一步之后就改不回来了。
  - id: alb-etiquetas
    nombre: 关标签窗口
    grupo: 电子货单处理
    desc: 确认后弹出的 MADISA 价签打印窗口直接关掉——要打价签你自己去打。
  - id: alb-cerrar
    nombre: 关货单窗口
    grupo: 电子货单处理
    desc: 关掉处理完的这张货单窗口，然后回到「全选货单」处理下一张，直到列表清空。

  - id: ug-buscar
    nombre: 查商品 (桌面)
    grupo: 桌面 UnideGes
    desc: 在桌面 Artículos 里按编号或 EAN 搜商品，是查价、改价、锁定、商品诊断共同的第一步。
  - id: ug-leer-precio
    nombre: 读价格 (桌面)
    grupo: 桌面 UnideGes
    desc: 读取当前打开商品的现价，改价之前先读一遍核对。
  - id: ug-cambiar-precio
    nombre: 改价 (桌面)
    grupo: 桌面 UnideGes
    desc: 在桌面修改商品价格，/precio_fruta 水果改价走这里。
  - id: ug-bloq
    nombre: 锁定商品 Bloq
    grupo: 桌面 UnideGes
    desc: 切换商品的 Bloq.Venta：停卖或恢复可卖（/bloq 命令）。
  - id: ug-rellenar-pedido
    nombre: 桌面填单
    grupo: 桌面 UnideGes
    desc: 把订单草稿填进桌面 UnideGes 的 Pedidos 订单（桌面填单通道）。

  # Raíz de todo lo web: para tocar promociones/pedidos/hacer un pedido,
  # el Edge tiene que estar conectado a la web de UnideGes. Este nodo es
  # el equivalente a "abrir UnideGes" pero para el navegador; su estado
  # sale de CADA operación web (si arranca, es que el Edge conectó).
  - id: web-abrir
    nombre: 打开 Unide 网页
    grupo: 网页
    desc: Edge 浏览器连上 UnideGes 网页版的会话状态；任何网页操作跑通都说明它连着。
  - id: web-promos
    nombre: 刷新促销
    grupo: 网页 · 查询分析
    match: ["刷新促销", "每日刷新促销"]
    desc: 抓当前未过期促销的商品明细并导出 CSV（/promociones，或每天早上自动跑）。
  - id: web-listar
    nombre: 读订单列表
    grupo: 网页 · 查询分析
    match: ["读订单列表"]
    desc: 读取 Pedidos 订单列表页，每日自动任务靠它找新的 PDA 单。
  - id: web-recientes
    nombre: 查最近订单
    grupo: 网页 · 查询分析
    match: ["检查最近订单"]
    desc: 只读翻看最近几张订单的完整明细（/pedidos 3），不会改任何东西。
  - id: web-buscar-pedido
    nombre: 按单名找单
    grupo: 网页 · 查询分析
    match: ["按单名找单"]
    desc: 按订单名或编号筛选查找订单。
  - id: web-ahorro
    nombre: 订单省钱分析
    grupo: 网页 · 查询分析
    match: ["订单省钱分析"]
    desc: 对照促销分析一张订单哪里能省钱（/ahorro_pedido）。

  - id: web-mensajeria
    nombre: 运营信息传递
    grupo: 网页 · 查询分析
    match: ["运营信息传递"]
    desc: 抓 Mensajería operativa 里过去一周的 albaranes 和 ficheros，下载并转发给你；fruta 类 fichero 自动跳过（/mensajeria）。

  - id: web-articulo
    nombre: 网页查商品资料
    grupo: 网页 · 查询分析
    match: ["网页查商品资料"]
    desc: 供应商表里没有的商品，去网页 Consultas → Artículos Unide 搜出来抄资料（PVD/PVP2/IVA/código），给建 TIENDA 档用（只读）。

  - id: web-buscar
    nombre: 搜商品
    grupo: 网页 · 下单
    match: ["搜商品"]
    desc: 网页下单时按商品名搜索，把候选发给你点选（不知道代码的时候用）。
  - id: web-rellenar
    nombre: 填订单
    grupo: 网页 · 下单
    match: ["填订单"]
    desc: 把点货单/草稿填进网页订单表单；只填，不会 Guardar 也不会 Enviar。
  - id: web-editar
    nombre: 改订单
    grupo: 网页 · 下单
    match: ["改订单"]
    desc: 在网页订单里改数量、加行、删行（/pedido_editar，或直接说「把851040改成一箱」）。
  - id: web-guardar
    nombre: 保存订单
    grupo: 网页 · 下单
    match: ["保存订单"]
    desc: 点 Guardar 保存网页订单，要你确认才执行。
  - id: web-enviar
    nombre: 发送订单
    grupo: 网页 · 下单
    match: ["发送订单"]
    desc: 点 Enviar Pedido 把订单发出去，要你确认才执行。

  - id: auto-advisor
    nombre: 每日促销+新单分析
    grupo: 每日自动
    desc: 每天早上的自动任务：先体检，再刷促销，然后找新 PDA 单并自动做省钱分析。
  - id: auto-llegada
    nombre: 到货清单抓取
    grupo: 每日自动
    match: ["到货清单抓取"]
    desc: 抓今天到货订单的数据（网页只读），是打印到货清单的数据来源。
  - id: auto-imprimir
    nombre: 打印到货清单
    grupo: 每日自动
    desc: 生成今天的到货核对清单并发给你（/llegada 走的也是这一步）。
  - id: auto-recordatorio
    nombre: 下单提醒
    grupo: 每日自动
    desc: 叫货日（周日/一/三/四）到点自动发叫货提醒。
  - id: tarea-programada
    nombre: 定时任务
    grupo: 每日自动
    desc: 你让 bot 记住的事（比如「明天早上提醒我…」），到点自动执行。

  - id: herr-tally
    nombre: 叫货点货单
    grupo: 工具
    desc: /carne、/fruta 点货单：手机上点数量代替纸质表，点完生成订单草稿。
  - id: herr-diag-productos
    nombre: 商品诊断
    grupo: 工具
    desc: /diagnostico_productos：发它 Excel/CSV 导出文件，逐件只读核对桌面商品并出诊断报告。
  - id: herr-update
    nombre: 更新 BOT
    grupo: 工具
    desc: 收到更新包后下载并覆盖安装，会保留 .env 和 config.local.json。

  - id: ai-router
    nombre: AI 意图识别
    grupo: AI 助手
    desc: 你说大白话时，由 AI 判断你其实想用哪个命令。
  - id: ai-responder
    nombre: AI 组织回复
    grupo: AI 助手
    desc: 把执行结果或报错组织成看得懂的人话再回复你。

  - id: diag-evidencia
    nombre: 打包证据
    grupo: AI 修复
    desc: UnideGes 桌面操作失败时自动触发：打包日志、截图、状态作为诊断证据。
  - id: diag-llm
    nombre: AI 诊断
    grupo: AI 修复
    desc: AI 分析证据，判断故障原因并给出修复方案（最多自动试 2 轮）。
  - id: diag-fix
    nombre: 本地修复
    grupo: AI 修复
    desc: 按诊断结论在本地自动修复，能修的直接修。
  - id: diag-pr
    nombre: 开 PR
    grupo: AI 修复
    desc: 本地修不了的，把诊断结果和修复建议开成 GitHub PR。

edges:
  - [ug-abrir-lanzar, ug-abrir-login]
  - [ug-abrir-login, ug-abrir]
  - [ug-abrir, ug-inicio]
  - [ug-abrir, ug-articulos]
  - [ug-abrir, ug-utilidades]
  - [ug-abrir, ug-albaranes]
  - [ug-abrir, ug-fin]
  # Los dos submenus cuelgan de su modulo Y de donde salen los ficheros que
  # tratan: 运营信息传递 los descarga, aqui se procesan (peticion del dueño).
  - [ug-albaranes, ug-albaran-electronico]
  - [web-mensajeria, ug-albaran-electronico]
  # El procesado de una factura, paso a paso y en el orden real que dicto
  # el dueno: procesar, guardar, descartar todos, filas azules, aceptar
  # todos, guardar, confirmar, si, cerrar etiquetas, cerrar ventana.
  - [ug-albaran-electronico, alb-marcar]
  - [alb-marcar, alb-procesar]
  - [alb-procesar, alb-desconocidos]
  - [alb-procesar, alb-sustituciones]
  - [alb-procesar, alb-revision]
  - [alb-revision, alb-guardar1]
  - [alb-guardar1, alb-descartar]
  - [alb-descartar, alb-azules]
  - [alb-azules, alb-azul-diag]
  - [herr-diag-productos, alb-azul-diag]
  - [alb-azules, alb-aceptar-todos]
  - [alb-azul-diag, alb-aceptar-todos]
  - [alb-aceptar-todos, alb-guardar2]
  - [alb-guardar2, alb-confirmar]
  - [alb-confirmar, alb-si]
  - [alb-si, alb-etiquetas]
  - [alb-etiquetas, alb-cerrar]
  - [ug-utilidades, ug-lmanma]
  - [web-mensajeria, ug-lmanma]
  - [web-abrir, web-promos]
  - [web-abrir, web-listar]
  - [web-abrir, web-recientes]
  - [web-abrir, web-buscar-pedido]
  - [web-abrir, web-buscar]
  - [web-abrir, web-editar]
  - [web-abrir, web-mensajeria]
  - [web-abrir, web-articulo]
  - [web-articulo, alb-azul-diag]
  - [web-promos, web-ahorro]
  - [web-listar, web-ahorro]
  - [web-promos, auto-advisor]
  - [web-ahorro, auto-advisor]
  - [web-buscar, web-rellenar]
  - [web-rellenar, web-guardar]
  - [web-editar, web-guardar]
  - [web-guardar, web-enviar]
  - [web-abrir, auto-llegada]
  - [auto-llegada, auto-imprimir]
  # 查价/改价/锁定/商品诊断 se operan DENTRO del módulo Artículos (F3),
  # así que cuelgan de él (petición del dueño, 23/07).
  - [ug-articulos, ug-buscar]
  - [ug-abrir, ug-rellenar-pedido]
  - [ug-buscar, ug-leer-precio]
  - [ug-leer-precio, ug-cambiar-precio]
  - [ug-buscar, ug-bloq]
  - [ug-buscar, herr-diag-productos]
  - [herr-tally, web-rellenar]
  - [herr-tally, ug-rellenar-pedido]
  - [ai-router, ai-responder]
  - [diag-evidencia, diag-llm]
  - [diag-llm, diag-fix]
  - [diag-llm, diag-pr]
