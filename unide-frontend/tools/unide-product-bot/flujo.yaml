# Árbol de funciones del bot para el panel de flujo (/flujo).
# - nodos: cada paso/función con su grupo y, si aplica, los prefijos de
#   etiqueta (match) con los que se registra su ejecución automáticamente.
# - edges: dependencias [prerrequisito, dependiente] — se dibujan como flechas.
# Este archivo se puede editar a mano; si se rompe, el panel de flujo lo avisa
# y se queda vacío (el bot sigue funcionando normal).

nodos:
  - id: ug-abrir
    nombre: 打开 UnideGes
    grupo: 桌面 UnideGes
    match: ["打开 UnideGes"]
  - id: ug-inicio
    nombre: 开始营业 (F1)
    grupo: 桌面 UnideGes
    match: ["UnideGes → Inicio de día"]
  - id: ug-articulos
    nombre: 商品 (F3)
    grupo: 桌面 UnideGes
    match: ["UnideGes → Artículos"]
  - id: ug-utilidades
    nombre: 工具 (F6)
    grupo: 桌面 UnideGes
    match: ["UnideGes → Utilidades"]
  - id: ug-albaranes
    nombre: 收货单 (F7)
    grupo: 桌面 UnideGes
    match: ["UnideGes → Albaranes"]
  - id: ug-fin
    nombre: 日结 (F12)
    grupo: 桌面 UnideGes
    match: ["UnideGes → Fin de día"]

  - id: web-promos
    nombre: 刷新促销
    grupo: 网页 · 查询分析
    match: ["刷新促销", "每日刷新促销"]
  - id: web-listar
    nombre: 读订单列表
    grupo: 网页 · 查询分析
    match: ["读订单列表"]
  - id: web-recientes
    nombre: 查最近订单
    grupo: 网页 · 查询分析
    match: ["检查最近订单"]
  - id: web-buscar-pedido
    nombre: 按单名找单
    grupo: 网页 · 查询分析
    match: ["按单名找单"]
  - id: web-ahorro
    nombre: 订单省钱分析
    grupo: 网页 · 查询分析
    match: ["订单省钱分析"]

  - id: web-buscar
    nombre: 搜商品
    grupo: 网页 · 下单
    match: ["搜商品"]
  - id: web-rellenar
    nombre: 填订单
    grupo: 网页 · 下单
    match: ["填订单"]
  - id: web-editar
    nombre: 改订单
    grupo: 网页 · 下单
    match: ["改订单"]
  - id: web-guardar
    nombre: 保存订单
    grupo: 网页 · 下单
    match: ["保存订单"]
  - id: web-enviar
    nombre: 发送订单
    grupo: 网页 · 下单
    match: ["发送订单"]

  - id: auto-advisor
    nombre: 每日促销+新单分析
    grupo: 每日自动
  - id: auto-llegada
    nombre: 到货清单抓取
    grupo: 每日自动
    match: ["到货清单抓取"]
  - id: auto-imprimir
    nombre: 打印到货清单
    grupo: 每日自动
  - id: auto-recordatorio
    nombre: 下单提醒
    grupo: 每日自动
  - id: tarea-programada
    nombre: 定时任务
    grupo: 每日自动

  - id: diag-evidencia
    nombre: 打包证据
    grupo: AI 修复
  - id: diag-llm
    nombre: AI 诊断
    grupo: AI 修复
  - id: diag-fix
    nombre: 本地修复
    grupo: AI 修复
  - id: diag-pr
    nombre: 开 PR
    grupo: AI 修复

edges:
  - [ug-abrir, ug-inicio]
  - [ug-abrir, ug-articulos]
  - [ug-abrir, ug-utilidades]
  - [ug-abrir, ug-albaranes]
  - [ug-abrir, ug-fin]
  - [web-promos, web-ahorro]
  - [web-listar, web-ahorro]
  - [web-promos, auto-advisor]
  - [web-ahorro, auto-advisor]
  - [web-buscar, web-rellenar]
  - [web-rellenar, web-guardar]
  - [web-editar, web-guardar]
  - [web-guardar, web-enviar]
  - [auto-llegada, auto-imprimir]
  - [diag-evidencia, diag-llm]
  - [diag-llm, diag-fix]
  - [diag-llm, diag-pr]
