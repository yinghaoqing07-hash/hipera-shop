# Árbol de funciones del bot para el panel de flujo (/flujo).
# - nodos: cada paso/función con su grupo y, si aplica, los prefijos de
#   etiqueta (match) con los que se registra su ejecución automáticamente.
# - edges: dependencias [prerrequisito, dependiente] — se dibujan como flechas.
# Este archivo se puede editar a mano; si se rompe, el panel de flujo lo avisa
# y se queda vacío (el bot sigue funcionando normal).

nodos:
  # Subpasos REALES de abrir la app (salen de la caja negra del PS:
  # "lanzo:" y la línea RESULT de login). Solo aparecen cuando tocan:
  # si la app ya estaba abierta no hay lanzamiento ni login.
  - id: ug-abrir-lanzar
    nombre: 启动程序
    grupo: 桌面 UnideGes
  - id: ug-abrir-login
    nombre: 自动登录
    grupo: 桌面 UnideGes
  - id: ug-abrir
    nombre: 打开 UnideGes
    grupo: 桌面 UnideGes
    match: ["打开 UnideGes"]
  - id: ug-inicio
    nombre: 开始营业 (F1)
    grupo: 桌面 UnideGes
    match: ["UnideGes → Inicio de día"]
  - id: ug-articulos
    nombre: 商品 (F3)
    grupo: 桌面 UnideGes
    match: ["UnideGes → Artículos"]
  - id: ug-utilidades
    nombre: 工具 (F6)
    grupo: 桌面 UnideGes
    match: ["UnideGes → Utilidades"]
  - id: ug-albaranes
    nombre: 收货单 (F7)
    grupo: 桌面 UnideGes
    match: ["UnideGes → Albaranes"]
  - id: ug-fin
    nombre: 日结 (F12)
    grupo: 桌面 UnideGes
    match: ["UnideGes → Fin de día"]

  - id: ug-buscar
    nombre: 查商品 (桌面)
    grupo: 桌面 UnideGes
  - id: ug-leer-precio
    nombre: 读价格 (桌面)
    grupo: 桌面 UnideGes
  - id: ug-cambiar-precio
    nombre: 改价 (桌面)
    grupo: 桌面 UnideGes
  - id: ug-bloq
    nombre: 锁定商品 Bloq
    grupo: 桌面 UnideGes
  - id: ug-rellenar-pedido
    nombre: 桌面填单
    grupo: 桌面 UnideGes

  - id: web-promos
    nombre: 刷新促销
    grupo: 网页 · 查询分析
    match: ["刷新促销", "每日刷新促销"]
  - id: web-listar
    nombre: 读订单列表
    grupo: 网页 · 查询分析
    match: ["读订单列表"]
  - id: web-recientes
    nombre: 查最近订单
    grupo: 网页 · 查询分析
    match: ["检查最近订单"]
  - id: web-buscar-pedido
    nombre: 按单名找单
    grupo: 网页 · 查询分析
    match: ["按单名找单"]
  - id: web-ahorro
    nombre: 订单省钱分析
    grupo: 网页 · 查询分析
    match: ["订单省钱分析"]

  - id: web-buscar
    nombre: 搜商品
    grupo: 网页 · 下单
    match: ["搜商品"]
  - id: web-rellenar
    nombre: 填订单
    grupo: 网页 · 下单
    match: ["填订单"]
  - id: web-editar
    nombre: 改订单
    grupo: 网页 · 下单
    match: ["改订单"]
  - id: web-guardar
    nombre: 保存订单
    grupo: 网页 · 下单
    match: ["保存订单"]
  - id: web-enviar
    nombre: 发送订单
    grupo: 网页 · 下单
    match: ["发送订单"]

  - id: auto-advisor
    nombre: 每日促销+新单分析
    grupo: 每日自动
  - id: auto-llegada
    nombre: 到货清单抓取
    grupo: 每日自动
    match: ["到货清单抓取"]
  - id: auto-imprimir
    nombre: 打印到货清单
    grupo: 每日自动
  - id: auto-recordatorio
    nombre: 下单提醒
    grupo: 每日自动
  - id: tarea-programada
    nombre: 定时任务
    grupo: 每日自动

  - id: herr-tally
    nombre: 叫货点货单
    grupo: 工具
  - id: herr-diag-productos
    nombre: 商品诊断
    grupo: 工具
  - id: herr-update
    nombre: 更新 BOT
    grupo: 工具

  - id: ai-router
    nombre: AI 意图识别
    grupo: AI 助手
  - id: ai-responder
    nombre: AI 组织回复
    grupo: AI 助手

  - id: diag-evidencia
    nombre: 打包证据
    grupo: AI 修复
  - id: diag-llm
    nombre: AI 诊断
    grupo: AI 修复
  - id: diag-fix
    nombre: 本地修复
    grupo: AI 修复
  - id: diag-pr
    nombre: 开 PR
    grupo: AI 修复

edges:
  - [ug-abrir-lanzar, ug-abrir-login]
  - [ug-abrir-login, ug-abrir]
  - [ug-abrir, ug-inicio]
  - [ug-abrir, ug-articulos]
  - [ug-abrir, ug-utilidades]
  - [ug-abrir, ug-albaranes]
  - [ug-abrir, ug-fin]
  - [web-promos, web-ahorro]
  - [web-listar, web-ahorro]
  - [web-promos, auto-advisor]
  - [web-ahorro, auto-advisor]
  - [web-buscar, web-rellenar]
  - [web-rellenar, web-guardar]
  - [web-editar, web-guardar]
  - [web-guardar, web-enviar]
  - [auto-llegada, auto-imprimir]
  # 查价/改价/锁定/商品诊断 se operan DENTRO del módulo Artículos (F3),
  # así que cuelgan de él (petición del dueño, 23/07).
  - [ug-articulos, ug-buscar]
  - [ug-abrir, ug-rellenar-pedido]
  - [ug-buscar, ug-leer-precio]
  - [ug-leer-precio, ug-cambiar-precio]
  - [ug-buscar, ug-bloq]
  - [ug-buscar, herr-diag-productos]
  - [herr-tally, web-rellenar]
  - [herr-tally, ug-rellenar-pedido]
  - [ai-router, ai-responder]
  - [diag-evidencia, diag-llm]
  - [diag-llm, diag-fix]
  - [diag-llm, diag-pr]
